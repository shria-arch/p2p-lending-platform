name: P2P Lending CI/CD

on:
  push:
    branches:
      - main

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and Push Auth Service
        uses: docker/build-push-action@v6
        with:
          context: ./backend/auth-service
          push: true
          tags: shriaarch/auth-service:latest

      - name: Build and Push Loan Service
        uses: docker/build-push-action@v6
        with:
          context: ./backend/loan-service
          push: true
          tags: shriaarch/loan-service:latest

      - name: Build and Push API Gateway
        uses: docker/build-push-action@v6
        with:
          context: ./backend/api-gateway
          push: true
          tags: shriaarch/api-gateway:latest

      - name: Build and Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: shriaarch/frontend:latest