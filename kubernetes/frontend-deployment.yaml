apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: p2p-lending

spec:
  replicas: 1

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:
      containers:
      - name: frontend
        image: shriaarch/frontend:latest
        imagePullPolicy: Always

        ports:
        - containerPort: 80